<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles.css" rel="stylesheet" />
    <title>Sign-up Form</title>
  </head>
  <body>
    <div id="header-container">
      <div class="logo-elements">
        <img
          src="./img/logo.svg"
          width="200"
          alt="Meditary logo showing order from chaos"
          id="logo-icon" />
        <h1>meditary</h1>
      </div>

      <p id="credit-text">
        Photo by
        <a
          href="https://unsplash.com/@seelean?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >一只猫的橘</a
        >
        on
        <a
          href="https://unsplash.com/photos/raindrops-creating-ripples-on-a-dark-reflective-surface-dmV6wRBzofo?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Unsplash</a
        >
      </p>
      <!-- <img
        src="./img/raindrops.jpg"
        class="background-img"
        alt="Background raindrops image" /> -->
    </div>
    <div id="content-container">
      <div id="hero-text-container">
        <p>
          Tame the raging chaos within you, <br />
          and embrace the order destined for you.
        </p>
        <br />
        <p>
          You <em><strong>deserve</strong></em> peace.
        </p>
      </div>
      <div id="form-container">
        <h2>
          Join <span class="slackside-font">meditary</span>, the premium
          meditation service.
        </h2>
        <form action="#" method="get" id="sign-up-form">
          <div>
            <label for="fname">FIRST NAME</label>
            <input type="text" id="fname" name="fname" placeholder="John" />
          </div>

          <div>
            <label for="lname">LAST NAME</label>
            <input type="text" id="lname" name="lname" placeholder="Odinson" />
          </div>

          <div>
            <label for="email">EMAIL</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="j.odinson@topmail.com" />
          </div>

          <div>
            <label for="phone-number">PHONE NUMBER</label>
            <input
              type="tel"
              id="phone-number"
              name="phone-number"
              placeholder="012-345678" />
          </div>

          <div>
            <label for="password1">PASSWORD</label>
            <input type="password" id="password1" name="password1" />
          </div>

          <div>
            <label for="password2">PASSWORD</label>
            <input type="password" id="password2" name="password2" />
          </div>
        </form>
      </div>
      <div id="bottom-container">
        <button type="submit" form="sign-up-form">Create Account</button>
        <p id="account-check-text">
          Already have an account? <a href="#">Log in</a>
        </p>
      </div>
    </div>
  </body>
</html>
